[package]
name = "remote_fs"
version = "0.1.0"
edition = "2021"


[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = "4.5.44"
colored = "3.0.0"
ctrlc = "3.4"
fern = "0.7.1"
libc = "0.2.175"
log = "0.4"
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15", features = ["serializable"] }
daemonize = "0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
winfsp_wrs = "0.4"

[features]
default = ["cache"]
cache = []
